# Automatikus telepítés: minden main ágra kerülő változás után a weboldal
# felkerül a cafeharmonic.hu-ra (Cloudflare Worker: cafe-harmonic).
# Kézzel is indítható: GitHub → Actions → "Telepítés (cafeharmonic.hu)" → Run workflow.
#
# Szükséges GitHub secret: CLOUDFLARE_API_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret)

name: Telepítés (cafeharmonic.hu)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Telepítés a Cloudflare-re
        run: npx --yes wrangler@4.156.2 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
